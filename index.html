<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID 2</title>

    <link href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white ">
        <div class="container px-3">
            <a class="navbar-brand d-flex flex-column align-items-center" href="#">
                <i class="fa-brands fa-atlassian fs-3 mt-2 mb-1"></i>
                <span class="h2" style="font-family: 'Teko'; color: #002d5b;">FOSE STAY</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#foseMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="foseMenu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown me-lg-3 language">
                        <a class="nav-link dropdown-toggle d-flex align-items-center fw-bold" style="color:#002d5b"
                            href="#" id="langMenu" role="button" data-bs-toggle="dropdown">
                            <span class="fi fi-vn me-2 style"></span> Tiếng Việt
                        </a>
                        <ul class="dropdown-menu border-0 shadow-sm animate-menu-language">
                            <li>
                                <a class="dropdown-item" href="#" style="color:#002d5b">
                                    <span class="fi fi-gb me-2"></span> English
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-signup mb-2 mb-md-0 " href="#">Đăng ký</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-signin mb-2 mb-md-0" href="#">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="sub-header position-relative">
            <div class="sub-header-image">
                <img src="/assets/images/sub_img.jpg" alt="Fose Stay banner">
            </div>
            <div class="container position-absolute top-50 start-50 translate-middle w-100 shadow-lg p-0 custom-rounded"
                style="max-width:950px; z-index:10; background-color: white;">
                <form id="searchForm">
                    <input type="hidden" name="booking_type" id="selectedType" value="hour">

                    <div class="type-icon-header d-flex justify-content-center pt-1">
                        <button type="button" class="btn active border-0 d-flex flex-column align-items-center tab-btn"
                            data-tab="hour">
                            <i class="fa-regular fa-hourglass mb-1"></i>
                            <span>Theo giờ</span>
                        </button>
                        <button type="button" class="btn border-0 d-flex flex-column align-items-center tab-btn"
                            data-tab="night">
                            <i class="fa-solid fa-moon mb-1"></i>
                            <span>Qua đêm</span>
                        </button>
                        <button type="button" class="btn border-0 d-flex flex-column align-items-center tab-btn"
                            data-tab="day">
                            <i class="fa-regular fa-calendar mb-1"></i>
                            <span>Theo ngày</span>
                        </button>
                    </div>

                    <div class="p-3">
                        <div class="search-wrapper d-flex align-items-center justify-content-between">

                            <div class="search-item flex-grow-1">
                                <div class="dropdown">
                                    <button class="search-content-btn border-0 w-100 text-start bg-transparent p-0"
                                        type="button" data-bs-toggle="dropdown" data-bs-display="static">
                                        <label class="search-inner-label">
                                            <i class="fas fa-map-marker-alt me-2"></i>Địa điểm
                                        </label>
                                        <div class="search-inner-value" id="locationDisplay">Bạn muốn đi đâu?</div>
                                    </button>
                                    <input type="hidden" name="location" id="locationInput">
                                    <ul class="dropdown-menu border-0 shadow-lg mt-3">
                                        <li><a class="dropdown-item py-2" href="#" data-value="Hồ Chí Minh">Hồ Chí
                                                Minh</a></li>
                                        <li><a class="dropdown-item py-2" href="#" data-value="Hà Nội">Hà Nội</a></li>
                                        <li><a class="dropdown-item py-2" href="#" data-value="Đà Nẵng">Đà Nẵng</a></li>
                                        <li><a class="dropdown-item py-2" href="#" data-value="Cần Thơ">Cần Thơ</a></li>
                                        <li><a class="dropdown-item py-2" href="#" data-value="Đà Lạt">Đà Lạt</a></li>
                                    </ul>
                                </div>
                            </div>

                            <div class="search-v-divider"></div>

                            <div class="search-item flex-grow-1">
                                <label class="search-inner-label"><i class="fa fa-calendar-check me-2"></i>Nhận
                                    phòng</label>
                                <input type="date" class="search-inner-input" id="checkin" required>
                            </div>

                            <div class="search-v-divider"></div>

                            <div class="search-item flex-grow-1">
                                <label class="search-inner-label"><i class="fas fa-calendar-times me-2"></i>Trả
                                    phòng</label>
                                <input type="date" class="search-inner-input" id="checkout" required>
                            </div>

                            <div class="search-v-divider"></div>

                            <div class="search-button-container">
                                <button type="submit" class="btn-search-pill">
                                    <i class="fas fa-search me-2"></i>Tìm kiếm
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="suggestion">
            <div class="container position-relative">
                <h3 class="fw-bold mb-4" style="color: #002d5b; margin-left: 10px;">Gợi ý từ Fose Stay</h3>

                <div class="slider-container">
                    <button class="suggestion-btn prev" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>

                    <div class="suggestion-wrapper overflow-hidden pt-1 pb-4">
                        <div class="row flex-nowrap g-3" id="suggestionRow">

                            <div class="col-6 col-md-4 col-lg-3 slider-item">
                                <div class="suggestion-card">
                                    <div class="icon-box"><i class="fa-solid fa-tags"></i></div>
                                    <p>Voucher 39K <br> Stay Hết Ý</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-4 col-lg-3 slider-item">
                                <div class="suggestion-card">
                                    <div class="icon-box"><i class="fa-regular fa-face-grin-hearts"></i></div>
                                    <p>Top Stay <br> Được Chọn</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-4 col-lg-3 slider-item">
                                <div class="suggestion-card">
                                    <div class="icon-box"><i class="fa-solid fa-venus-mars"></i></div>
                                    <p>Love <br> Room</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-4 col-lg-3 slider-item">
                                <div class="suggestion-card">
                                    <div class="icon-box"><i class="fa-regular fa-comments"></i></div>
                                    <p>Top Review</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-4 col-lg-3 slider-item">
                                <div class="suggestion-card">
                                    <div class="icon-box"><i class="fa-solid fa-champagne-glasses"></i></div>
                                    <p>Dining</p>
                                </div>
                            </div>

                        </div>
                    </div>

                    <button class="suggestion-btn next" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
